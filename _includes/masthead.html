{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="minimal-nav" aria-label="Primary navigation">
        <a class="minimal-nav__brand" href="{{ base_path }}/">{{ site.title }}</a>
        <ul>
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
